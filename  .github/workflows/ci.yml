name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          echo "Checking GAV structure..."
          test -f public/index.html && echo "OK: public/index.html"
          test -f public/validation-key.txt && echo "OK: validation-key.txt"
          test -f api/auth/verify.js && echo "OK: api/auth/verify.js"
          test -f api/payment/approve.js && echo "OK: api/payment/approve.js"
          test -f api/payment/complete.js && echo "OK: api/payment/complete.js"
          echo "All checks passed."