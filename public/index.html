<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAV - The Incense Route | Pi Network</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      direction: rtl;
    }
    #app { padding: 20px; max-width: 600px; margin: 0 auto; }
    .header { text-align: center; padding: 30px 0; }
    .header h1 { font-size: 1.5rem; color: #f0b90b; margin-bottom: 8px; }
    .header p { color: #888; font-size: 0.9rem; }
    .btn {
      background: #f0b90b; color: #000; border: none;
      padding: 14px 28px; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      width: 100%; margin: 10px 0;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline {
      background: transparent; border: 2px solid #f0b90b; color: #f0b90b;
    }
    .card {
      background: #1a1a1a; border-radius: 16px;
      padding: 20px; margin: 16px 0; border: 1px solid #333;
    }
    .card h3 { color: #f0b90b; margin-bottom: 12px; font-size: 1.1rem; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: #f0b90b; display: flex;
      align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .loading { text-align: center; padding: 60px 20px; color: #888; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #333;
      border-top-color: #f0b90b; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff4444; text-align: center; padding: 20px; }
    .hidden { display: none !important; }
    .footer-nav {
      display: flex; justify-content: space-around;
      padding: 16px 0; border-top: 1px solid #333;
      margin-top: 30px;
    }
    .footer-nav span { color: #666; font-size: 0.8rem; cursor: pointer; }
    .footer-nav span.active { color: #f0b90b; }
    .logout-btn {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      font-size: 0.8rem;
      width: 100%;
    }
    .logout-btn:hover { border-color: #f0b90b; color: #f0b90b; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>جاري التحقق من شبكة Pi...</p>
      <p style="font-size:0.8rem;color:#555;margin-top:12px">
        إذا لم تظهر الصفحة خلال 12 ثانية، تأكد من فتح التطبيق داخل Pi Browser.
      </p>
    </div>
    <div id="error" class="error hidden"></div>
    <div id="main" class="hidden">
      <div class="header">
        <h1>🦅 GAV - طريق اللبان</h1>
        <p>منصة مقايضة اجتماعية على شبكة Pi</p>
      </div>
      <div class="card">
        <div class="user-info">
          <div class="avatar">😀</div>
          <div>
            <strong id="username">-</strong>
            <div style="color:#888;font-size:0.8rem" id="uid">-</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
      </div>
      <div class="card">
        <h3>📊 رصيد YER المستحق</h3>
        <p style="font-size:2rem;color:#f0b90b" id="yer-balance">0</p>
        <p style="color:#888;font-size:0.8rem">يُحدَّث وفق نتائج تصويت الحوكمة</p>
      </div>
      <button class="btn" id="btn-create-offer">🤝 إنشاء عرض مقايضة فردية</button>
      <button class="btn btn-outline" id="btn-festivals">🎪 مهرجانات المقايضة القريبة</button>
      <button class="btn btn-outline" id="btn-vote">🗳️ لوحة التصويت والحوكمة</button>
      <div class="footer-nav">
        <span class="active">🏠 الرئيسية</span>
        <span>👤 الملف</span>
        <span>🗺️ الخريطة</span>
        <span>💰 المحفظة</span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // GAV — Testnet Pi Authentication
    // sandbox: true | Pi-only auth | Server-side verification
    // ============================================================

    const BOOT_TIMEOUT_MS = 12000;

    let bootTimer = null;
    let currentAccessToken = null;
    let currentUser = null;
    const pendingIncomplete = [];

    function armFailsafe() {
      if (bootTimer) clearTimeout(bootTimer);
      bootTimer = setTimeout(function () {
        if (typeof Pi === 'undefined') {
          showError('Pi SDK لم يتم تحميله. افتح التطبيق داخل Pi Browser.');
          return;
        }
        showError(
          'انتهت مهلة التحقق. تأكد من فتح التطبيق داخل Pi Browser وأن الشبكة متاحة.'
        );
      }, BOOT_TIMEOUT_MS);
    }

    function disarmFailsafe() {
      if (bootTimer) {
        clearTimeout(bootTimer);
        bootTimer = null;
      }
    }

    function getSession() {
      try {
        return {
          token: sessionStorage.getItem('pi_access_token'),
          uid: sessionStorage.getItem('pi_uid'),
          username: sessionStorage.getItem('pi_username')
        };
      } catch (e) {
        return {};
      }
    }

    function saveSession(token, user) {
      try {
        sessionStorage.setItem('pi_access_token', token);
        sessionStorage.setItem('pi_uid', user.uid);
        sessionStorage.setItem('pi_username', user.username || '');
      } catch (e) {
        console.warn('sessionStorage unavailable');
      }
    }

    function clearSession() {
      try {
        sessionStorage.removeItem('pi_access_token');
        sessionStorage.removeItem('pi_uid');
        sessionStorage.removeItem('pi_username');
      } catch (e) {}
    }

    async function processIncompletePayment(payment, token) {
      try {
        const res = await fetch('/api/payment/incomplete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentId: payment.identifier,
            accessToken: token
          })
        });
        const data = await res.json().catch(function () { return {}; });
        console.log('[GAV] Incomplete payment resolved:', data);
        return data;
      } catch (err) {
        console.warn('[GAV] Failed to process incomplete payment:', err);
        return null;
      }
    }

    function onIncompletePaymentFound(payment) {
      console.warn(
        '[GAV] Incomplete payment found:',
        payment && payment.identifier
      );
      if (currentAccessToken) {
        processIncompletePayment(payment, currentAccessToken);
      } else {
        pendingIncomplete.push(payment);
      }
    }

    async function verifyOnBackend(accessToken) {
      const res = await fetch('/api/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessToken: accessToken })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        throw new Error(data.message || 'فشل التحقق من الهوية');
      }
      return data;
    }

    function showError(msg) {
      disarmFailsafe();
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('main').classList.add('hidden');
      const el = document.getElementById('error');
      el.classList.remove('hidden');
      el.innerHTML =
        '<div>' + msg + '</div>' +
        '<button onclick="location.reload()" ' +
        'style="background:#f0b90b;color:#000;border:none;padding:10px 20px;' +
        'border-radius:8px;cursor:pointer;margin-top:16px">إعادة المحاولة</button>';
    }

    function showMain(verified) {
      disarmFailsafe();
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      document.getElementById('username').textContent =
        verified.username || 'مستخدم Pi';
      document.getElementById('uid').textContent = verified.uid
        ? 'UID: ' + verified.uid.slice(0, 12) + '...'
        : '';
      document.getElementById('yer-balance').textContent =
        verified.yerBalance || '0';
    }

    async function bootstrap() {
      armFailsafe();

      try {
        if (typeof Pi === 'undefined') {
          throw new Error(
            'Pi SDK لم يتم تحميله. افتح التطبيق داخل Pi Browser.'
          );
        }

        await Pi.init({ version: '2.0', sandbox: true });

        const auth = await Pi.authenticate(
          ['username', 'payments'],
          onIncompletePaymentFound
        );

        if (!auth || !auth.accessToken) {
          throw new Error('لم يتم استلام accessToken من Pi.');
        }

        currentAccessToken = auth.accessToken;

        while (pendingIncomplete.length) {
          const p = pendingIncomplete.shift();
          await processIncompletePayment(p, currentAccessToken);
        }

        const verified = await verifyOnBackend(currentAccessToken);
        currentUser = verified;
        saveSession(currentAccessToken, verified);
        showMain(verified);
      } catch (err) {
        console.error('[GAV] bootstrap error:', err);
        showError(
          (err && err.message) ||
            'حدث خطأ. تأكد من فتح التطبيق داخل Pi Browser.'
        );
      }
    }

    function navigate(page) {
      const token = getSession().token;
      if (!token) {
        alert('يرجى تسجيل الدخول أولاً');
        return;
      }
      window.location.href = '/' + page;
    }

    function logout() {
      clearSession();
      currentAccessToken = null;
      currentUser = null;
      window.location.reload();
    }

    window.logout = logout;

    const btnCreate = document.getElementById('btn-create-offer');
    if (btnCreate) {
      btnCreate.addEventListener('click', function () {
        navigate('create-offer.html');
      });
    }

    const btnFestivals = document.getElementById('btn-festivals');
    if (btnFestivals) {
      btnFestivals.addEventListener('click', function () {
        navigate('festivals.html');
      });
    }

    const btnVote = document.getElementById('btn-vote');
    if (btnVote) {
      btnVote.addEventListener('click', function () {
        navigate('voting.html');
      });
    }

    const footerSpans = document.querySelectorAll('.footer-nav span');
    footerSpans.forEach(function (el, idx) {
      el.addEventListener('click', function () {
        const pages = ['index.html', 'profile.html', 'map.html', 'wallet.html'];
        if (pages[idx]) navigate(pages[idx]);
      });
    });

    bootstrap();
  </script>
</body>
</html>
