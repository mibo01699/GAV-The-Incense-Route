<script>
  // Pi SDK Initialization — Testnet (sandbox: true)
  async function initPi() {
    if (typeof Pi === 'undefined') {
      throw new Error('Pi SDK not loaded. Open this app inside Pi Browser.');
    }
    await Pi.init({ version: '2.0', sandbox: true });
  }

  async function authenticatePi() {
    const scopes = ['username', 'payments'];
    function onIncompletePaymentFound(payment) {
      console.warn('Incomplete payment detected:', payment.identifier);
      fetch('/api/payment/incomplete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payment })
      }).catch(() => {});
    }
    return await Pi.authenticate(scopes, onIncompletePaymentFound);
  }

  async function verifyOnBackend(accessToken) {
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || 'فشل التحقق من الهوية');
    }
    return res.json();
  }

  function showError(msg) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main').classList.add('hidden');
    const el = document.getElementById('error');
    el.classList.remove('hidden');
    el.textContent = msg;
  }

  function showMain(verified) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    document.getElementById('username').textContent = verified.username || 'مستخدم Pi';
    document.getElementById('uid').textContent =
      verified.uid ? 'UID: ' + verified.uid.slice(0, 12) + '...' : '';
    document.getElementById('yer-balance').textContent = verified.yerBalance || '0';
  }

  // حفظ accessToken للاستخدام في الصفحات الأخرى
  function saveSession(token, user) {
    try {
      sessionStorage.setItem('pi_access_token', token);
      sessionStorage.setItem('pi_uid', user.uid);
      sessionStorage.setItem('pi_username', user.username || '');
    } catch (e) { console.warn('sessionStorage unavailable'); }
  }

  function getSessionToken() {
    try { return sessionStorage.getItem('pi_access_token'); } catch (e) { return null; }
  }

  async function bootstrap() {
    try {
      await initPi();
      const auth = await authenticatePi();
      const verified = await verifyOnBackend(auth.accessToken);
      saveSession(auth.accessToken, verified);
      showMain(verified);
    } catch (err) {
      console.error(err);
      showError(err.message || 'حدث خطأ. تأكد من فتح التطبيق داخل Pi Browser.');
    }
  }

  // ============================================================
  // Navigation — الأزرار الآن تنتقل إلى صفحات فعلية
  // ============================================================
  function navigate(page) {
    const token = getSessionToken();
    if (!token) {
      alert('يرجى تسجيل الدخول أولاً');
      return;
    }
    window.location.href = '/' + page;
  }

  document.getElementById('btn-create-offer')?.addEventListener('click', () => {
    navigate('create-offer.html');
  });
  document.getElementById('btn-festivals')?.addEventListener('click', () => {
    navigate('festivals.html');
  });
  document.getElementById('btn-vote')?.addEventListener('click', () => {
    navigate('voting.html');
  });

  // Footer navigation
  document.querySelectorAll('.footer-nav span').forEach((el, idx) => {
    el.addEventListener('click', () => {
      const pages = ['index.html', 'profile.html', 'map.html', 'wallet.html'];
      if (pages[idx]) navigate(pages[idx]);
    });
  });

  bootstrap();
</script>
